<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - OTP Test System</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="otp-panel" aria-labelledby="page-title">
      <p class="eyebrow">Development tool</p>
      <h1 id="page-title">Verify OTP</h1>
      <p class="intro">Enter the email address and one-time password used for this test.</p>

      <form id="verify-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="user@example.com"
          required
        >

        <label for="otp">6-digit OTP</label>
        <input
          id="otp"
          name="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          placeholder="123456"
          required
        >

        <div class="button-row">
          <button type="submit" id="verify-button">Verify OTP</button>
          <a href="/">Return to Send OTP</a>
        </div>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
